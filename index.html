
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine's Wordle | A Secret Word</title>
    
    <!-- SEO & Social Sharing -->
    <meta name="description" content="A whimsical Valentine's Wordle. Can you guess the secret word of the heart?">
    <meta property="og:title" content="Valentine's Wordle">
    <meta property="og:description" content="A romantic puzzle for someone special. Guess the word to reveal a surprise.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#fff1f2">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">

    <!-- Tailwind CDN with Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        },
                    },
                    fontFamily: {
                        romantic: ['Playfair Display', 'serif'],
                        script: ['Dancing Script', 'cursive'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce 1.2s ease-in-out 2',
                        'pop': 'pop 0.1s ease-out',
                        'fadeIn': 'fadeIn 0.5s ease-out forwards',
                        'spin-slow': 'spin 12s linear infinite',
                        'spin-reverse': 'spin-reverse 15s linear infinite',
                        'float-soft': 'float-soft 3s ease-in-out infinite',
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.05)' },
                            '100%': { transform: 'scale(1)' },
                        },
                        fadeIn: {
                            from: { opacity: '0', transform: 'translateY(10px)' },
                            to: { opacity: '1', transform: 'translateY(0)' },
                        },
                        'spin-reverse': {
                            from: { transform: 'rotate(360deg)' },
                            to: { transform: 'rotate(0deg)' },
                        },
                        'float-soft': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #fff5f7;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            color: #4c0519;
        }
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatWhimsical {
            0% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.4; }
            25% { transform: translateY(-25vh) translateX(20px) rotate(15deg) scale(1.1); }
            50% { transform: translateY(-50vh) translateX(-20px) rotate(-15deg) scale(1); }
            75% { transform: translateY(-75vh) translateX(15px) rotate(10deg) scale(1.15); }
            90% { opacity: 0.4; }
            100% { transform: translateY(-110vh) translateX(0) rotate(0deg) scale(1); opacity: 0; }
        }
        @keyframes floatDrift {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            33% { transform: translateY(-33vh) translateX(-30px) rotate(-20deg); }
            66% { transform: translateY(-66vh) translateX(30px) rotate(20deg); }
            90% { opacity: 0.3; }
            100% { transform: translateY(-110vh) translateX(0) rotate(0deg); opacity: 0; }
        }
        .float-item {
            position: absolute;
            bottom: -60px;
            will-change: transform, opacity;
        }
        .float-whimsical { animation: floatWhimsical 18s ease-in-out infinite; }
        .float-drift { animation: floatDrift 22s ease-in-out infinite; }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 182, 193, 0.3);
        }
        .stable-transform {
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        .seal-text {
            font-size: 8px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 700;
            fill: #fb7185;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body class="antialiased selection:bg-rose-200">
    <div id="heart-container"></div>
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
